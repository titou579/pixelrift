services:
  - type: web
    name: pixelrift-api
    env: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: ACCOUNT_TITOU_PWD
        sync: false
      - key: ACCOUNT_THOMAS_PWD
        sync: false
      - key: ACCOUNT_HUGO_PWD
        sync: false
      - key: ACCOUNT_LILOU_PWD
        sync: false
      - key: ACCOUNT_MATTEO_PWD
        sync: false
      - key: CLIENT_URL
        sync: false

  - type: web
    name: pixelrift
    env: static
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        sync: false
